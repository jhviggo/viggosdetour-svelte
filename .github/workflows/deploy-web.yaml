name: Deploying frontend
on: push

env:
  CONTAINER_REPO: aaitho/services
  INFRA: ./infrastructure

jobs:
  push-image:
    name: Build docker image and push to repository
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Build Docker image
        env:
          DOCKER_IMAGE: ${{ env.CONTAINER_REPO }}:viggosdetour-${{ github.sha  }}
        run: |
          docker build -t $DOCKER_IMAGE .
          docker login -u ${{ secrets.DOCKER_USERNAME }} -p ${{ secrets.DOCKER_PASSWORD }}
          docker push $DOCKER_IMAGE

  k3s-deploy:
    name: Deploy service to K3S
    needs: push-image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - uses: azure/setup-kubectl@v3
        id: install

      - name: Configure kubectl
        run: |
          mkdir $HOME/.kube/
          echo "${{ secrets.KUBE_CONFIG }}" >> $HOME/.kube/config
      
      - name: Deploy kubernetes definitions
        env:
          CONTAINER_REPO: ${{ env.CONTAINER_REPO }}
          GITHUB_SHA: ${{ github.sha }}
        run: |
          envsubst < deployment-spec.yaml > def.yaml
          kubectl apply -f def.yaml
      
      - name: Wait for service to be ready
        run: |
          kubectl rollout status deployment/viggosdetour --timeout=30s
          
      
      
