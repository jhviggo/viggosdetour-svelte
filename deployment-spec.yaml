apiVersion: apps/v1
kind: Deployment
metadata:
  name: viggosdetour
spec:
  selector:
    matchLabels:
      app: viggosdetour
  replicas: 1
  template:
    metadata:
      labels:
        app: viggosdetour
    spec:
      containers:
        - name: viggosdetour
          image: ${CONTAINER_REPO}:viggosdetour-${GITHUB_SHA}
          readinessProbe:
            httpGet:
              path: /
              port: 8080
            failureThreshold: 3
            periodSeconds: 10
          ports:
            - containerPort: 8080

---

apiVersion: v1
kind: Service
metadata:
  name: viggosdetour
spec:
  type: ClusterIP
  ports:
    - port: 80
      targetPort: 8080
  selector:
    app: viggosdetour

---

kind: Ingress
apiVersion: networking.k8s.io/v1
metadata:
  name: viggosdetour
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "false"
spec:
  ingressClassName: nginx
  rules:
  - host: viggosdetour.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: viggosdetour
            port:
              number: 80